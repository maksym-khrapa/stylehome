<section>
    <div>
        <h3>Get Your Free Consultation Today</h3>
        <p>Fill out the form below, and one of our experts will contact you shortly to provide personalized advice and solutions for your project.</p>
        <form action="#" method="post">
            <label>
                First Name *
                <br>
                <input type="text" name="first_name" placeholder="Add your name" required>
            </label>
            <label>
                Last Name *
                <br>
                <input type="text" name="last_name" placeholder="Add your last name" required>
            </label>
            <label>
                Email *
                <br>
                <input type="email" name="email" placeholder="Email" required>
            </label>
            <label>
                Phone Number *
                <br>
                <input type="tel" name="phone" placeholder="000 000 0000" required>
            </label>
            <label>
                Project Type *
                <br>
                <select name="project_type" placeholder="Select" required>
                    <option value="decor_panel">Decor panel</option>
                    <option value="kitchen">Kitchen Remodeling</option>
                    <option value="bathroom">Bathroom Remodeling</option>
                    <option value="home">Whole Home Remodeling</option>
                </select>
            </label>
            <label>
                Project Location *
                <br>
                <input type="text" name="location" placeholder="Your Location" required>
            </label>
            <label>
                Estimated Budget
                <br>
                <select name="budget" placeholder="Select">
                    <option value="low">Under $5k</option>
                    <option value="medium1">$5k – $10k</option>
                    <option value="medium2">$10k – $25k</option>
                    <option value="high">Over $25k</option>
                </select>
            </label>
            <label>
                Preferred Timeline To Start
                <br>
                <select name="timeline">
                    <option value="">Select</option>
                    <option value="immediately">Within 14 days</option>
                    <option value="1_month">Within 1-2 months</option>
                    <option value="3_months">Within 3-6 months</option>
                </select>
            </label>
            <br><br>
            <label>
                Project Details *
                <br>
                <textarea name="project_details" placeholder="Describe your projects" rows="4" required></textarea>
            </label>
            <button type="submit">Send</button>
        </form>
    </div>
</section>
